<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>InfiniteSettler</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #10161d; }
      /* Kein Gummiband-Scrollen und keine Textauswahl beim Wischen. */
      html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      body { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6edf3; }
      #game { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      #game.dragging { cursor: grabbing; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
